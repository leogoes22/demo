.m-close{position:absolute;top:1rem;right:1rem;z-index:5;width:36px;height:36px;background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.2);color:var(--gold);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}

.m-dots{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);display:flex;gap:0.4rem;}

.m-dot.on{background:var(--gold);}

let curV=null,curImg=0,imgs=[];
function detectCat(v){if(v.category==='MOTO')return'moto';const b=(v.body_type||'').toLowerCase();const m=(v.model||v.title||'').toLowerCase();if(b==='hatch'||m.includes('gol')||m.includes('polo')||m.includes('golf')||m.includes('focus')||m.includes('yaris')||m.includes('sandero'))return'hatch';if(b==='sedan'||m.includes('civic')||m.includes('corolla')||m.includes('cruze')||m.includes('siena'))return'sedan';if(b==='suv'||m.includes('hrv')||m.includes('compass')||m.includes('renegade')||m.includes('rav4')||m.includes('x2')||m.includes('pajero')||m.includes('aircross'))return'suv';if(b==='caminhonete'||m.includes('hilux'))return'picape';return'outros';}
function populateFilters(vs){const ms=[...new Set(vs.map(v=>v.make).filter(Boolean))].sort();const as=[...new Set(vs.map(v=>v.year).filter(Boolean))].sort((a,b)=>b-a);const mSel=document.getElementById('fmarca'),aSel=document.getElementById('fano');ms.forEach(m=>mSel.innerHTML+=`<option value="${m}">${m}</option>`);as.forEach(a=>aSel.innerHTML+=`<option value="${a}">${a}</option>`);}
function renderStock(vs){const g=document.getElementById('s-grid');document.getElementById('pcount').textContent=vs.length+' veículo'+(vs.length!==1?'s':'')+' encontrado'+(vs.length!==1?'s':'');if(!vs.length){g.innerHTML='<div class="no-res">Nenhum veículo encontrado.</div>';return;}g.innerHTML=vs.map(v=>{const img=(v.images_large&&v.images_large[0])||'';const p=parseFloat(v.price),fipe=parseFloat(v.valor_fipe);const isFipe=p>0&&fipe>0&&p<fipe;const pFmt=p>0?'R$ '+p.toLocaleString('pt-BR'):'Consultar';const ano=v.fabric_year&&v.year&&String(v.fabric_year)!==String(v.year)?`${v.fabric_year}/${v.year}`:String(v.year||'');const km=parseFloat(v.mileage||0);const kmFmt=km>0?km.toLocaleString('pt-BR')+' km':'—';return`<div class="v-card" onclick="openM(${v.vehicle_id})"><div class="v-img">${img?`<img src="${img}" alt="${v.model}" loading="lazy">`:'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#333">🚗</div>'}<div class="v-fipe">${isFipe?'⭐ ABAIXO DA FIPE':''}</div><div class="v-cat">${detectCat(v).toUpperCase()}</div></div><div class="v-info"><div class="v-brand">${v.make||''}</div><div class="v-name">${(v.model||v.title||'').toUpperCase()}</div><div class="v-meta">${ano} · ${kmFmt} · ${v.color||''}</div><div class="v-price-row"><div class="v-price">${pFmt}</div><button class="v-btn">Ver →</button></div></div></div>`;}).join('');}
function applyF(){const s=document.getElementById('fs').value.toLowerCase();const cat=document.getElementById('fcat').value;const marca=document.getElementById('fmarca').value;const ano=document.getElementById('fano').value;const pr=document.getElementById('fpreco').value;let f=VEHICLES.filter(v=>{const full=((v.make||'')+(v.model||v.title||'')).toLowerCase();if(s&&!full.includes(s))return false;if(cat&&detectCat(v)!==cat)return false;if(marca&&v.make!==marca)return false;if(ano&&String(v.year)!==ano)return false;if(pr){const[min,max]=pr.split('-').map(Number);const p=parseFloat(v.price||0);if(p<min||p>max)return false;}return true;});renderStock(f);}
function resetF(){['fs','fcat','fmarca','fano','fpreco'].forEach(id=>document.getElementById(id).value='');renderStock(VEHICLES);}
['fs','fcat','fmarca','fano','fpreco'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('change',applyF);if(id==='fs')el.addEventListener('input',applyF);});
function openM(id){const v=VEHICLES.find(x=>x.vehicle_id===id);if(!v)return;curV=v;imgs=v.images_large||[];curImg=0;document.getElementById('m-brand').textContent=v.make||'';document.getElementById('m-title').textContent=(v.model||v.title||'').toUpperCase();const p=parseFloat(v.price);document.getElementById('m-price').textContent=p>0?'R$ '+p.toLocaleString('pt-BR'):'Consultar preço';document.getElementById('m-img').src=imgs[0]||'';const ano=v.fabric_year&&v.year&&String(v.fabric_year)!==String(v.year)?`${v.fabric_year}/${v.year}`:String(v.year||'');const km=parseFloat(v.mileage||0);document.getElementById('m-specs').innerHTML=[{l:'Ano',v:ano},{l:'KM',v:km>0?km.toLocaleString('pt-BR')+' km':'—'},{l:'Cor',v:v.color||'—'},{l:'Câmbio',v:v.gear||'—'},{l:'Combustível',v:v.fuel||'—'},{l:'Motor',v:v.motorization?v.motorization+' L':'—'}].map(s=>`<div><div class="ms-lbl">${s.l}</div><div class="ms-val">${s.v}</div></div>`).join('');const acs=(v.accessories||'').split(',').filter(a=>a.trim());document.getElementById('m-acess').innerHTML=acs.length?`<div class="m-acess-title">Acessórios</div><div class="m-acess-tags">${acs.map(a=>`<span class="m-tag">${a.trim()}</span>`).join('')}</div>`:'';document.getElementById('m-dots').innerHTML=imgs.map((_,i)=>`<div class="m-dot${i===0?' on':''}" onclick="setImg(${i})"></div>`).join('');document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden';}
function closeM(){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';}
function setImg(i){curImg=i;document.getElementById('m-img').src=imgs[i]||'';document.querySelectorAll('.m-dot').forEach((d,j)=>d.classList.toggle('on',j===i));}
function pImg(d){setImg((curImg+d+imgs.length)%imgs.length);}
function wppCar(){if(!curV)return;const model=(curV.make||'')+' '+(curV.model||curV.title||'');const msg=encodeURIComponent(`Olá! Tenho interesse no veículo:\n🚗 *${model} ${curV.year}*\n\nGostaria de mais informações e condições de pagamento.`);window.open(`https://wa.me/${WPP}?text=${msg}`,'_blank');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeM();});
populateFilters(VEHICLES);
renderStock(VEHICLES);
</script>
